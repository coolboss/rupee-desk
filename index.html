<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rupee Desk</title>
<meta name="description" content="A private household finance planner for India, for every age, income and occupation: a step-by-step plan, net worth, cash flow, income tax under both regimes with advance tax, business and practice, goals, retirement, loans, insurance and after-tax investment comparison.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a5d6b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Rupee Desk. Third tool in the Rupee for Life family: a household account book.
   Layout idea: one ledger page per subject; summary on top, working rows beneath; phone first, sidebar on wide screens.
   Peacock teal for what works for you, marigold for money due, brick red for shortfalls. Numbers in mono. */
:root{
  --bg:#edf1f1; --sheet:#fbfcfc; --ink:#13201f; --ink-2:#31423f; --ink-3:#5a6b68; --rule:#c4d0ce; --grid:#e0e8e7;
  --accent:#0a5d6b; --accent-soft:#d8e9ec; --gold:#9a5f05; --gold-soft:#f6e7c7; --red:#b0352a; --red-soft:#f7e0dc; --ok:#1c7548; --ok-soft:#ddefe4;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --display:"Rozha One",Georgia,serif; --sans:"Hind","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tab-h:60px; --shadow:rgb(19 32 31/.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1516; --sheet:#141e20; --ink:#e3ecec; --ink-2:#bfcccb; --ink-3:#8a9b99; --rule:#2a3a3c; --grid:#1c2a2c;
  --accent:#5cc3d3; --accent-soft:#143036; --gold:#e5a843; --gold-soft:#3a2c12; --red:#f08473; --red-soft:#3b1f1b; --ok:#62cf91; --ok-soft:#14301f;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --shadow:rgb(0 0 0/.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1516; --sheet:#141e20; --ink:#e3ecec; --ink-2:#bfcccb; --ink-3:#8a9b99; --rule:#2a3a3c; --grid:#1c2a2c;
  --accent:#5cc3d3; --accent-soft:#143036; --gold:#e5a843; --gold-soft:#3a2c12; --red:#f08473; --red-soft:#3b1f1b; --ok:#62cf91; --ok-soft:#14301f;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --shadow:rgb(0 0 0/.45); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 0 calc(var(--tab-h) + env(safe-area-inset-bottom,0px)) 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--rule)}
.brand{font:400 1.5rem/1 var(--display);letter-spacing:0}
.brand em{font-style:normal;color:var(--accent)}
.top-r{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);font:600 .82rem/1 var(--sans);white-space:nowrap}
.chip:hover{border-color:var(--ink-3)}
.savestate{font:500 .74rem/1.2 var(--sans);color:var(--ink-3);display:flex;align-items:center;gap:5px}
.savestate i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.savestate.local i{background:var(--gold)}
.wideonly{display:none}
@media (min-width:560px){.wideonly{display:inline}}
.brand{white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));outline:none}
.tabbar{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);background:var(--sheet);border-top:1px solid var(--rule)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 .68rem/1 var(--sans);color:var(--ink-3);min-width:0}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
.side{display:none}
@media (min-width:980px){
  body{padding-bottom:0}
  .tabbar{display:none}
  .layout{display:grid;grid-template-columns:216px minmax(0,1fr);max-width:1400px;margin:0 auto}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto;padding:16px 10px 16px 16px;border-right:1px solid var(--rule)}
  .side h2{font:600 .64rem/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:14px 10px 4px}
  .side button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font:500 .94rem/1.2 var(--sans);color:var(--ink-2)}
  .side button:hover{background:var(--sheet)}
  .side button[aria-current="page"]{background:var(--ink);color:var(--sheet)}
  .subnav{display:none!important}
  main{padding-top:22px}
}
.subnav{display:flex;gap:6px;overflow-x:auto;margin:-4px -16px 14px;padding:4px 16px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;min-height:38px;padding:0 14px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);font:600 .86rem/1 var(--sans);color:var(--ink-2)}
.subnav button[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* page furniture */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.ph h2{font:400 1.7rem/1.1 var(--display);text-wrap:balance}
.ph p{color:var(--ink-3);font-size:.9rem;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.cols .sticky{position:sticky;top:73px}}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;min-width:0}
.card>h3,.eyebrow{font:600 .68rem/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.card>h3 span:last-child:not(:first-child){letter-spacing:0;text-transform:none;font:500 .78rem/1.2 var(--mono)}
.hero{background:var(--accent);border-color:var(--accent);color:#fbfcfc;border-radius:14px;padding:18px 18px 16px}
:root[data-theme="dark"] .hero{color:#0d1516}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{color:#0d1516}}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .big{font:400 clamp(2.2rem,1.4rem + 4vw,3.2rem)/1 var(--display)}
.hero .sub{margin-top:8px;font:500 .86rem/1.4 var(--mono);opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:11px 13px;min-width:0;text-align:left;display:block;width:100%}
button.tile:hover{border-color:var(--ink-3)}
.tile .k{font:600 .64rem/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{margin-top:4px;font:500 1.22rem/1.2 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{margin-top:2px;font:400 .8rem/1.35 var(--sans);color:var(--ink-3)}
.tile.good .v{color:var(--ok)}.tile.warn .v{color:var(--gold)}.tile.bad .v{color:var(--red)}
.note{padding:10px 13px;border-radius:9px;background:var(--accent-soft);font-size:.9rem;line-height:1.45}
.note.gold{background:var(--gold-soft)}.note.bad{background:var(--red-soft)}.note.ok{background:var(--ok-soft)}
.note b{font-weight:600}
.small{font-size:.82rem;color:var(--ink-3);line-height:1.45}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between;padding:12px 14px;border:1px dashed var(--gold);background:var(--gold-soft);border-radius:12px;font-size:.92rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:40px;padding:0 14px;border:1px solid var(--rule);border-radius:9px;background:var(--sheet);font:600 .88rem/1 var(--sans)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.ghost{border-style:dashed;color:var(--accent)}
.btn.sm{min-height:34px;padding:0 10px;font-size:.8rem}

/* checks */
.checks{display:flex;flex-direction:column}
.check{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--grid);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.check:first-child{border-top:0}
.check .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 .74rem/1 var(--sans);color:var(--sheet);margin-top:1px}
.check.bad .ic{background:var(--red)}.check.warn .ic{background:var(--gold)}.check.ok .ic{background:var(--ok)}.check.info .ic{background:var(--accent)}
.check .t{font-weight:600;line-height:1.3}
.check .d{font-size:.86rem;color:var(--ink-3);line-height:1.4;margin-top:2px}
.check .go{color:var(--ink-3);font-size:1.1rem;align-self:center}
details.fold>summary{cursor:pointer;list-style:none;padding:10px 0 2px;font:600 .86rem/1.3 var(--sans);color:var(--accent)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"+ "}details.fold[open]>summary::before{content:"− "}

/* rows and lists */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--grid);background:none;text-align:left;width:100%}
.rows>.row:first-child{border-top:0}
button.row:hover .n{color:var(--accent)}
.row .n{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.row .m{font-size:.8rem;color:var(--ink-3);line-height:1.35}
.row .a{font:500 1rem/1.2 var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .a small{display:block;font:400 .74rem/1.3 var(--sans);color:var(--ink-3)}
.grp{font:600 .66rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;padding:12px 0 2px;border-top:1px solid var(--rule)}
.grp:first-child{border-top:0;padding-top:0}
.grp span:last-child{font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--ink-2)}
.empty{padding:14px 0;color:var(--ink-3);font-size:.92rem}
.tag{display:inline-block;font:600 .68rem/1 var(--sans);padding:4px 7px;border-radius:999px;white-space:nowrap;background:var(--grid);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--gold-soft);color:var(--gold)}.tag.bad{background:var(--red-soft);color:var(--red)}.tag.acc{background:var(--accent);color:var(--sheet)}
.meter{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter.warn i{background:var(--gold)}

/* forms */
.form details{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;margin-bottom:10px}
.form summary{cursor:pointer;list-style:none;padding:13px 16px;font:600 .8rem/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px}
.form summary::-webkit-details-marker{display:none}
.form summary span{font:500 .8rem var(--mono);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px 16px;padding:2px 16px 16px}
.card .fields{padding:0}
.f label{display:block;font:500 .84rem/1.3 var(--sans);color:var(--ink-2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;min-height:44px;padding:8px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);font-family:var(--mono);font-size:1rem}
.f select,.f input[type="text"],.f input[type="date"],.f textarea{font-family:var(--sans)}
.f small{display:block;margin-top:3px;font:400 .76rem/1.35 var(--sans);color:var(--ink-3);min-height:1em}
.f.wide{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid var(--rule);border-radius:10px;background:var(--bg)}
.seg button{flex:1 1 auto;border:0;background:transparent;min-height:38px;padding:0 12px;border-radius:7px;font:600 .84rem/1.15 var(--sans);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{min-height:40px;padding:0 14px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);font:600 .9rem/1 var(--sans)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.pill.off{opacity:.6}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:400 .88rem/1.35 var(--sans)}
td,th{padding:6px 6px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
td:first-child,th:first-child{text-align:left;padding-left:0}
td:last-child,th:last-child{padding-right:0}
th{font:600 .64rem/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--ink-3);white-space:nowrap}
td{font-family:var(--mono)}td:first-child{font-family:var(--sans)}
tr.tot td{font-weight:600;border-top:1px solid var(--ink-3);border-bottom:3px double var(--ink-3)}
tr.sub td{color:var(--ink-3);font-size:.82rem}
tr.now td{background:var(--gold-soft)}
.neg{color:var(--red)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reg{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-width:0}
.reg.best{border-color:var(--accent);background:var(--accent-soft)}
.reg .k{font:600 .68rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px;align-items:center}
.reg .v{font:500 1.35rem/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:5px;overflow-wrap:anywhere}
.pin{position:sticky;top:57px;z-index:10;margin:0 -16px 12px;padding:9px 16px;background:var(--ink);color:var(--sheet);display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.84rem}
.pin{border:0;width:calc(100% + 32px);text-align:left;cursor:pointer}
.pin b{font:500 1.05rem/1.1 var(--mono);display:block}
.pin span{opacity:.8;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
@media (min-width:980px){.pin{display:none}}

/* charts */
.segbar{display:flex;gap:2px;height:22px;border-radius:5px;overflow:hidden}
.segbar i{display:block;height:100%;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font:500 .82rem/1.3 var(--sans);color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend b{font:500 .82rem var(--mono);color:var(--ink);margin-left:4px}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,1fr);gap:3px}
.hb .l{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;line-height:1.3}
.hb .l span:first-child{overflow-wrap:anywhere}
.hb .l span:last-child{font:500 .84rem var(--mono);white-space:nowrap;color:var(--ink)}
.hb .b{height:10px;border-radius:0 4px 4px 0;background:var(--c1);min-width:2px}
.hb.dim{opacity:.5}
.hb .x{font-size:.74rem;color:var(--ink-3)}
svg.ch{display:block;width:100%;height:auto;overflow:visible}
svg.ch text{font:500 11px var(--sans);fill:var(--ink-3)}
svg.ch .gl{stroke:var(--grid);stroke-width:1}
svg.ch .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.ch .ln2{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.ch .band{fill:var(--accent);opacity:.14}
svg.ch .dot{fill:var(--accent);stroke:var(--sheet);stroke-width:2}
svg.ch .hit{fill:transparent}
svg.ch .hit:hover,svg.ch .hit:focus{fill:var(--ink);opacity:.07;outline:none}
svg.ch .mark{stroke:var(--gold);stroke-width:1;stroke-dasharray:none}
#tip{position:fixed;z-index:60;max-width:260px;padding:8px 10px;background:var(--ink);color:var(--bg);border-radius:8px;font:500 .8rem/1.4 var(--sans);pointer-events:none;box-shadow:0 6px 20px var(--shadow)}

/* sheet (dialog) */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgb(10 16 14/.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:92%;overflow:auto;background:var(--sheet);border-radius:16px 16px 0 0;border:1px solid var(--rule);padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet-h h2{font:400 1.4rem/1.1 var(--display)}
.sheet .fields{padding:0}
.sheet .btns{margin-top:16px;justify-content:space-between}
#toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font:500 .88rem/1.3 var(--sans);display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px var(--shadow);max-width:calc(100% - 32px)}
#toast button{border:0;background:none;color:var(--gold-soft);font-weight:700;text-decoration:underline}
@media (min-width:980px){#toast{bottom:24px}}
.cal-m{font:400 1.15rem/1.2 var(--display);margin:14px 0 2px}
.cal-m:first-child{margin-top:0}
.days{font:600 .72rem/1 var(--mono);padding:4px 7px;border-radius:999px;background:var(--grid);color:var(--ink-2);white-space:nowrap}
.days.soon{background:var(--red-soft);color:var(--red)}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--grid);font-size:.94rem;line-height:1.4}
.checkline:first-child{border-top:0}
.checkline input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
footer.fine{margin-top:22px;font-size:.78rem;line-height:1.5;color:var(--ink-3);max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.top,.tabbar,.side,.subnav,.btns,.pin,#toast{display:none!important}body{background:#fff;padding:0}.layout{display:block}}

/* plan */
.nextstep{text-align:left;width:100%;display:block;border-color:var(--accent)}
.nextstep:hover{background:var(--accent-soft)}
.nextstep .t{display:block;font:400 1.3rem/1.2 var(--display);text-wrap:balance}
.nextstep .d{display:block;margin-top:6px;font-size:.9rem;line-height:1.45;color:var(--ink-2)}
.steps{display:flex;flex-direction:column;counter-reset:st}
.step{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:11px;align-items:start;padding:12px 0;border:0;border-top:1px solid var(--grid);background:none;text-align:left;width:100%}
.step:first-child{border-top:0}
.step .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 .82rem/1 var(--mono);border:1.5px solid var(--accent);color:var(--accent)}
.step .ic::before{content:counter(st)}
.step.done .ic{background:var(--ok);border-color:var(--ok);color:var(--sheet)}.step.done .ic::before{content:"✓"}
.step.watch .ic{border-color:var(--gold);color:var(--gold)}
.step.na .ic{border-color:var(--rule);color:var(--ink-3)}.step.na .ic::before{content:"–"}
.step .t{font-weight:600;line-height:1.3;display:block}
.step .d{font-size:.86rem;color:var(--ink-3);line-height:1.45;margin-top:3px;display:block}
.step.done .t,.step.na .t{font-weight:500;color:var(--ink-2)}
.step.next{background:var(--gold-soft);margin:0 -16px;padding:12px 16px;width:calc(100% + 32px);border-top-color:transparent}
.step.next+.step{border-top-color:transparent}
.tips{margin:0;padding-left:1.1em;font-size:.92rem;line-height:1.5}
.tips li{margin:.35em 0}
.qs h3{font:600 .7rem/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--rule)}
.qs h3:first-child{margin-top:0;padding-top:0;border-top:0}
.mixrow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center;margin-top:8px;font-size:.84rem;color:var(--ink-2)}
.mixrow .segbar{height:18px}

<body>
<div id="app"><noscript>Rupee Desk needs JavaScript.</noscript></div>
<div id="sheet" class="sheet-wrap" hidden></div>

<script>

  function taxOn(c, o) {
    const regime = o.regime === "old" ? "old" : "new", huf = !!o.huf, age = huf ? 40 : num(o.age) || 40;

    const normal = max0(c.normal), st = max0(c.st), lt = max0(c.lt), lo = max0(c.lo), vda = max0(c.vda), agri = max0(c.agri);
    const div = Math.min(max0(c.div), normal);

  /* ---------- one person, one regime ---------- */

    const target = max0(g.cost) * Math.pow(1 + inf, yrs);
    const fromSaved = max0(g.saved) * Math.pow(1 + r, yrs), fromSip = fvSip(max0(g.sip), r, yrs, step);

  function xirr(flows) { /* flows: [{t: Date|ms, v}], returns yearly rate or NaN */

  function retirementSim(q, runs, seed) {

function lineChart(o) { /* {x:[labels], y:[...], y2, lo, hi, tips:[...], markX, markLabel, label} */

    <div class="cols"><div class="form" id="tx-form">${taxSections(p).map(s => `<details ${s.open ? "open" : ""} data-sec="${s.id}"><summary>${esc(s.t)}<span data-sum="${s.id}"></span></summary><div class="fields">${s.f.map(f => fieldHTML(f, f.top ? p[f.k] : p.t[f.k], { bind: "data-path", prefix: "t-", keyOf: z => "members." + i + "." + (z.top ? "" : "t.") + z.k })).join("")}</div></details>`).join("")}
      <div class="btns" style="margin:4px 0 14px"><label class="checkline" style="border:0;padding:0;align-items:center"><input type="checkbox" id="tx-on" ${p.on !== false ? "checked" : ""}> Count ${esc(p.name)} in household totals</label>${S.members.length > 1 ? '<button class="btn sm danger" type="button" id="tx-del">Remove this person</button>' : ""}</div>
      ${p.kind === "huf" ? '<p class="small">An HUF has no salary, standard deduction or rebate, and uses the under-60 slabs.</p>' : ""}</div>
      <div class="stack sticky" id="tx-out"></div></div>
    <footer class="fine">Covers resident individuals and HUFs. Not modelled: losses brought forward from earlier years, foreign income and relief, AMT, the 20%-with-indexation option for property bought before 23 July 2024, the ₹7.5 lakh cap on employer retirement contributions, and the waiver of 234C interest on capital gains that arise late in the year. Where slab income is just over ₹2 crore or ₹5 crore and there are also large capital gains, marginal relief is measured on total income, as the Finance Act words it. Rules verified ${FE.RULES_VERIFIED}.</footer>`;
  },
  mount(v) {
    const p = taxWho();
    v.addEventListener("change", e => { const el = e.target.closest("[data-path]"); if (el && /\.(bizMode|kind)$/.test(el.dataset.path)) { if (p.kind === "huf") p.age = ""; render(); } });
    $("#tx-pin", v).onclick = () => $("#tx-out", v).scrollIntoView({ behavior: "smooth", block: "start" });
    $("#tx-on", v).onchange = e => { p.on = e.target.checked; save(); this.refresh(v); };
    const del = $("#tx-del", v); if (del) del.onclick = () => { const i = S.members.indexOf(p); S.members.splice(i, 1); S.ui.taxWho = S.members[0].id; save(); render(); toast(p.name + " removed", () => { S.members.splice(i, 0, p); S.ui.taxWho = p.id; save(); render(); }); };
    v.addEventListener("click", e => {
      const b = e.target.closest("[data-who]"); if (b) { S.ui.taxWho = b.dataset.who; save(); render(); return; }
      if (e.target.closest("#tx-add")) editItem({ title: "Add a person", isNew: 1, fields: [{ k: "name", label: "Name", type: "text", req: 1 }, { k: "kind", label: "Taxpayer", type: "select", opts: [["ind", "Individual"], ["huf", "HUF"]] }, { k: "age", label: "Age (individuals)", type: "num", max: 120 }], item: { kind: "ind", age: 40 }, onSave: d => { const m = blankMember(d.kind, d.name); if (d.kind !== "huf") m.age = N(d.age) || 40; S.members.push(m); S.ui.taxWho = m.id; save(); render(); } });
    });
    $("#tx-copy", v).onclick = async e => { const Y = FE.YEARS[S.year], lines = people().map(m => { const x = taxOf(m); return `${m.name}: ${x.b.pick} regime, tax ${inr(x.b.r.tax)} (new ${inr(x.b.nw.tax)}, old ${inr(x.b.od.tax)}); still to pay ${inr(x.due)}`; }); try { await navigator.clipboard.writeText("Rupee Desk, " + Y.label + "\n" + lines.join("\n")); toast("Summary copied"); } catch (err) { toast("Copy was blocked by the browser"); } };
    this.refresh(v);
  },
  refresh(v) {
    const p = taxWho(), Y = FE.YEARS[S.year], x = taxOf(p), { nw, od, pick, r } = x.b, a = x.a, t = p.t, n = k => Math.max(0, N(t[k]));
    $("#tx-pills", v).innerHTML = S.members.map(m => `<button class="pill ${m.on === false ? "off" : ""}" type="button" data-who="${m.id}" aria-pressed="${m.id === p.id}">${esc(m.name || "Person")}</button>`).join("") + `<button class="btn sm ghost" type="button" id="tx-add">Add person</button>`;
    $("#tx-pin", v).innerHTML = `<span style="opacity:1;letter-spacing:0;text-transform:none"><span>${esc(p.name)} · ${pick} regime</span><b>${inr(r.tax)}</b></span><span style="text-align:right;opacity:1;letter-spacing:0;text-transform:none"><span>${a.refund > 0 ? "Refund" : "Still to pay"} ↓</span><b>${inr(a.refund > 0 ? a.refund : x.due)}</b></span>`;
    const sums = { sal: r.sal, hp: r.hp, biz: r.biz, oth: r.oth, cg: N(t.st111A) + N(t.lt112A) + N(t.ltOther) + N(t.stSlab) + n("vda"), ded: r.ded, paid: n("tds") + n("tcs") + a.paid };
    $$("[data-sum]", v).forEach(el => { const s = sums[el.dataset.sum]; el.textContent = s ? words(s) : ""; });
    const reg = (z, lab, k) => `<div class="reg ${k === pick ? "best" : ""}"><div class="k"><span>${lab}</span>${k === pick ? `<span class="tag acc">${p.regime === "auto" || !p.regime ? "lower" : "chosen"}</span>` : ""}</div><div class="v">${inr(z.tax)}</div><div class="small">${pct(z.TI > 0 ? z.tax / z.TI : 0)} of ${sh(z.TI)} taxable</div></div>`;
    const row = (l, val, c) => `<tr class="${c || ""}"><td>${l}</td><td class="${val < 0 ? "neg" : ""}">${inr(val)}</td></tr>`;
    const comp = `<table>${r.sal ? row("Salary and pension, after standard deduction" + (r.hra ? " and HRA" : ""), r.sal) : ""}${r.hp ? row("House property", r.hp) : ""}${r.biz ? row("Business or profession", r.biz) : ""}${r.oth ? row("Interest, dividends, other", r.oth) : ""}${r.stSlab ? row("Short-term gains at slab", r.stSlab) : ""}${row("Income at slab rates", r.gti, "tot")}${r.dl.map(d => row(esc(d[0]), -d[1], "sub")).join("")}${row("Taxable at slab rates", r.normal, "tot")}${r.gainsGross ? row("Capital gains at special rates", r.c.st + r.c.lt + r.c.lo + r.c.vda, "sub") : ""}
      ${row("Tax at slab rates", r.slabTax)}${r.rebate ? row(r.marginalRebate ? "Marginal relief near ₹12 lakh" : "Rebate, " + FE.sec(S.year, "87A"), -r.rebate, "sub") : ""}${r.specTax ? row("Tax on capital gains", r.specTax) : ""}${r.sur || r.relief ? row("Surcharge" + (r.relief ? ", after marginal relief of " + inr(r.relief) : " at " + pct(r.surRateSlab, 0)), r.sur) : ""}${row("Health and education cess, 4%", r.cess)}${row("Total tax", r.tax, "tot")}${a.credits ? row("Less TDS and TCS", -a.credits, "sub") : ""}${a.paid ? row("Less advance tax paid", -a.paid, "sub") : ""}${a.refund > 0 ? row("Refund due", a.refund, "tot") : row("Balance of tax", a.balance, "tot")}</table>`;
    let adv;
    if (!a.required) adv = `<div class="note ok">${a.seniorExempt ? "Aged 60 or more with no business or professional income: advance tax is not required." : "Tax after TDS is under ₹10,000: advance tax is not required."}${a.balance > 0 ? " Pay " + inr(a.balance) + " as self-assessment tax before filing." : ""}</div>`;
    else adv = `${a.next ? `<div class="note gold"><b>Pay ${inr(a.next.amount)} by ${dfmt(a.next.due)}.</b> ${a.next.days} days left. That brings you to ${Math.round(a.next.share * 100)}% of the year's tax.</div>` : a.ended ? `<div class="note">The year has ended. Pay the balance with interest as self-assessment tax.</div>` : ""}
      ${a.presumptive ? '<p class="small" style="margin-top:8px">Presumptive scheme: the whole amount may be paid in one instalment by 15 March.</p>' : ""}
      <div class="tw" style="margin-top:10px"><table><tr><th>Due</th><th>Needed by then</th><th>Paid</th><th>Short</th><th>234C</th></tr>${a.rows.map(w => `<tr class="${a.next && +a.next.due === +w.due ? "now" : ""}"><td>${dfmt(w.due, { day: "numeric", month: "short", year: "2-digit" })}</td><td>${inr(w.need)}</td><td>${inr(w.paid)}</td><td class="${w.short > 0 && w.past ? "neg" : ""}">${w.past || w.short === 0 ? inr(w.short) : "–"}</td><td class="${w.int > 0 && w.past ? "neg" : ""}">${w.past ? inr(w.int) : "–"}</td></tr>`).join("")}</table></div>
      <div class="tw" style="margin-top:10px"><table>${row("Balance of tax", a.balance)}${row("234C interest on instalments already missed", a.c234Accrued)}${a.ended ? row("234B interest, " + a.b234Months + " months", a.b234) : ""}${row("To pay as things stand", x.due, "tot")}</table></div>
      ${!a.ended && (a.c234 > a.c234Accrued || a.b234 > 0) ? `<p class="small" style="margin-top:8px">If you pay nothing more until the balance is settled ${N(t.payMonth) || 4} months after March, interest would reach about ${inr(a.c234 + a.b234)} (234C ${inr(a.c234)}, 234B ${inr(a.b234)}).</p>` : ""}`;
    const mr = FE.marginalRates(p, S.year), hh = people().map(taxOf);
    $("#tx-out", v).innerHTML = `<section class="card"><h3><span>${esc(p.name)}: both regimes</span><span>${p.kind === "huf" ? "HUF" : "age " + (N(p.age) || 40)}</span></h3><div class="duo">${reg(nw, "New regime", "new")}${reg(od, "Old regime", "old")}</div>
        <p class="small" style="margin-top:8px">${Math.abs(nw.tax - od.tax) < 10 ? "Both regimes give the same tax." : `The ${x.b.better} regime saves ${inr(x.b.saving)}.`} ${(t.bizMode || "none") !== "none" ? "With business or professional income, choosing the old regime needs Form 10-IEA before the due date. You may come back to the new regime once; after that the old regime is closed to you while that income continues." : "Without business income you can choose afresh each year when you file."}</p></section>
      <section class="card"><h3><span>Computation, ${pick} regime</span><span>₹</span></h3><div class="tw">${comp}</div>${r.notes.length ? `<div class="stack" style="gap:6px;margin-top:10px">${r.notes.map(z => `<div class="note gold">${esc(z)}</div>`).join("")}</div>` : ""}</section>
      <section class="card"><h3><span>Advance tax and interest</span><span>on ${inr(a.net)}</span></h3>${adv}</section>
      <section class="card"><h3><span>What the next ₹100 costs ${esc(p.name)}</span></h3><div class="tiles"><div class="tile"><div class="k">Interest or salary</div><div class="v">₹${(mr.int * 100).toFixed(2)}</div></div><div class="tile"><div class="k">Short-term equity gain</div><div class="v">₹${(mr.stcg * 100).toFixed(2)}</div></div><div class="tile"><div class="k">Long-term equity gain</div><div class="v">₹${(mr.ltcg * 100).toFixed(2)}</div><div class="s">beyond ₹1.25 lakh a year</div></div></div><p class="small" style="margin-top:8px">These marginal rates feed the after-tax comparison under Compare options.</p></section>
      <section class="card"><h3><span>Household</span><span>${hh.length} ${hh.length === 1 ? "person" : "people"}</span></h3><div class="tw"><table><tr><th>Person</th><th>Regime</th><th>Tax</th><th>To pay</th></tr>${hh.map(h => `<tr><td>${esc(h.m.name)}</td><td>${h.b.pick}</td><td>${inr(h.b.r.tax)}</td><td>${inr(h.due)}</td></tr>`).join("")}<tr class="tot"><td>Total</td><td></td><td>${inr(hh.reduce((s, h) => s + h.b.r.tax, 0))}</td><td>${inr(hh.reduce((s, h) => s + h.due, 0))}</td></tr></table></div></section>`;
  }
};

/* Rupee Desk views: Goals, Retirement, Loans, Insurance, Compare options, Calculators, Calendar, Data */
"use strict";
const bound = (f, obj, base) => fieldHTML(f, obj[f.k], { bind: "data-path", prefix: base.replace(/\W/g, "-") + "-", keyOf: z => base + "." + z.k });
const ym = months => !isFinite(months) ? "never" : (months >= 12 ? Math.floor(months / 12) + " yr " : "") + (months % 12 ? (months % 12) + " mo" : months >= 12 ? "" : "0 mo");

/* ---------- Goals ---------- */
const GOAL_F = () => [{ k: "name", label: "Goal", type: "text", req: 1, wide: 1 }, { k: "year", label: "Year you need the money", type: "num", min: TODAY.getFullYear(), max: TODAY.getFullYear() + 60, req: 1 }, { k: "cost", label: "Cost in today's rupees (₹)", req: 1 }, { k: "infl", label: "Price rise for this goal (% a year)", type: "pct", max: 20, hint: "Education 8 to 10, general 5 to 6" }, { k: "saved", label: "Already set aside (₹)" }, { k: "sip", label: "Investing now (₹ a month)" }, { k: "step", label: "Raise the monthly amount by (% a year)", type: "pct", max: 30 }, { k: "ret", label: "Expected return (% a year)", type: "pct", max: 20, hint: "Under 3 years 6 to 7; 3 to 7 years 8 to 9; longer 10 to 11" }];
const GOAL_TPL = [["Child's education", 12, 2500000, 9, 10], ["Home down payment", 5, 3000000, 6, 8], ["Car", 4, 1200000, 5, 7], ["Wedding", 6, 2000000, 7, 8], ["Big trip", 2, 400000, 6, 6.5], ["Start a business", 3, 1500000, 6, 7], ["Parents' care fund", 5, 1000000, 10, 8]];
VIEWS.goals = {
  render() {
    const yr = TODAY.getFullYear(), T = FE.totals(S), st = S.goals.map(g => ({ g, s: FE.goalStatus(g, yr) })).sort((a, b) => N(a.g.year) - N(b.g.year));
    const now = S.goals.reduce((s, g) => s + N(g.sip), 0), need = st.reduce((s, x) => s + Math.max(N(x.g.sip), x.s.need), 0);
    return `<div class="ph"><div><h2>Goals</h2><p>Each goal gets its own cost, date and monthly amount. Costs are inflated to the year you need them.</p></div><div class="btns"><button class="btn pri" type="button" id="add-g">Add goal</button></div></div>
    <div class="pills" style="margin-bottom:12px" aria-label="Quick add">${GOAL_TPL.map((t, i) => `<button class="btn sm ghost" type="button" data-tpl="${i}">+ ${t[0]}</button>`).join("")}</div>
    <div class="stack">${S.goals.length ? `<div class="tiles"><div class="tile"><div class="k">Investing now</div><div class="v">${sh(now)}</div><div class="s">a month, all goals</div></div><div class="tile ${need > now * 1.001 ? "warn" : "good"}"><div class="k">Needed</div><div class="v">${sh(need)}</div><div class="s">a month to fund every goal</div></div><div class="tile ${T.surplus >= need - now ? "good" : "bad"}"><div class="k">Monthly surplus</div><div class="v">${sh(T.surplus)}</div><div class="s">${need > now ? (T.surplus >= need - now ? "covers the extra " + sh(need - now) : "short of the extra " + sh(need - now)) : "from Cash flow"}</div></div></div>` : ""}
    ${st.map(({ g, s }) => `<button class="card" type="button" data-goal="${g.id}" style="text-align:left;width:100%"><div class="row" style="padding:0;border:0"><span><span class="n" style="font-size:1.08rem">${esc(g.name)}</span><span class="m" style="display:block">${esc(g.year)} · ${s.yrs} ${s.yrs === 1 ? "year" : "years"} away · ${sh(N(g.cost))} today becomes ${sh(s.target)}</span></span><span class="tag ${s.onTrack ? "ok" : "warn"}">${s.onTrack ? "On track" : "Short " + sh(s.gap)}</span></div>
      <div class="meter ${s.onTrack ? "" : "warn"}"><i style="width:${Math.round(s.funded * 100)}%"></i></div>
      <div class="small" style="margin-top:8px">Projected ${sh(s.projected)} (${Math.round(s.funded * 100)}%). You invest ${inr(N(g.sip))} a month${N(g.step) ? ", rising " + N(g.step) + "% a year" : ""}; ${s.yrs === 0 ? "the goal is due this year." : s.onTrack ? inr(s.need) + " would be enough." : "<b style='color:var(--ink)'>" + inr(s.need) + " a month is needed</b>."}${s.yrs > 0 && s.yrs <= 3 && N(g.ret) > 8 ? " With under three years to go, keep this money out of equity." : ""}</div></button>`).join("") || '<div class="card"><p class="empty">No goals yet. Add a child\'s education, a home, a car or a big trip.</p></div>'}
    <p class="small">Projections use one steady return. Markets do not move steadily: move each goal's money to deposits or debt funds over its last three years.</p></div>`;
  },
  mount(v) {
    $("#add-g", v).onclick = () => editItem({ title: "Add a goal", isNew: 1, fields: GOAL_F(), item: { id: uid(), year: TODAY.getFullYear() + 5, infl: N(S.settings.infl) || 6, ret: 9, step: 5 }, onSave: d => upsert(S.goals, d) });
    v.addEventListener("click", e => { const t = e.target.closest("[data-tpl]"); if (t) { const g = GOAL_TPL[+t.dataset.tpl]; editItem({ title: "Add a goal", isNew: 1, fields: GOAL_F(), item: { id: uid(), name: g[0], year: TODAY.getFullYear() + g[1], cost: g[2], infl: g[3], ret: g[4], step: 5 }, onSave: d => upsert(S.goals, d) }); return; }
      const b = e.target.closest("[data-goal]"); if (!b) return; const it = S.goals.find(x => x.id === b.dataset.goal); editItem({ title: "Edit goal", fields: GOAL_F(), item: it, onSave: d => upsert(S.goals, d), onDelete: () => removeItem(S.goals, it.id, it.name) }); });
  }
};

/* ---------- Retirement ---------- */
const RET_F = [{ k: "age", label: "Your age now", type: "num", max: 100 }, { k: "retAge", label: "Age you stop working", type: "num", max: 100 }, { k: "endAge", label: "Plan until age", type: "num", max: 110, hint: "For a couple, use the younger partner's 90 to 95" }, { k: "corpus", label: "Retirement investments today (₹)" }, { k: "saveMonthly", label: "Adding (₹ a month)" }, { k: "stepUp", label: "Raise that by (% a year)", type: "pct", max: 30 }, { k: "spend", label: "Yearly spending in retirement, today's rupees (₹)" }, { k: "pension", label: "Pension or rent in retirement, a year (₹)", hint: "Today's rupees; assumed to keep up with prices" }, { k: "eqPre", label: "Equity share while working (%)", type: "pct", max: 100 }, { k: "eqPost", label: "Equity share in retirement (%)", type: "pct", max: 100 }];
const RET_ADV = [{ k: "infl", label: "Inflation (% a year)", type: "pct", max: 15 }, { k: "eqRet", label: "Equity return (% a year)", type: "pct", max: 20 }, { k: "eqVol", label: "Equity swings (% a year)", type: "pct", max: 40 }, { k: "debtRet", label: "Debt return (% a year)", type: "pct", max: 12 }];
VIEWS.retire = {
  render() {
    return `<div class="ph"><div><h2>Retirement</h2><p>Will the money last? 500 possible futures for your plan, in today's rupees.</p></div><div class="btns"><button class="btn" type="button" id="rt-use">Use my investments total</button></div></div>
    <div class="cols"><div class="stack"><section class="card"><h3><span>Your plan</span></h3><div class="fields">${RET_F.map(f => bound(f, S.retire, "retire")).join("")}</div></section>
      <details class="fold card"><summary style="padding:0">Return and inflation assumptions</summary><div class="fields" style="margin-top:12px">${RET_ADV.map(f => bound(f, S.retire, "retire")).join("")}</div><p class="small" style="margin-top:10px">Defaults: equity 11.5% a year with 18% swings, debt 7%, inflation 6%. Returns are after costs and before tax, so keep some margin.</p></details></div>
      <div class="stack sticky" id="rt-out"></div></div>`;
  },
  mount(v) { $("#rt-use", v).onclick = () => { S.retire.corpus = Math.round(FE.totals(S).invest); const m = S.members.find(x => x.kind !== "huf"); if (m && N(m.age)) S.retire.age = N(m.age); save(); render(); toast("Taken from Assets and loans"); }; this.refresh(v); },
  refresh(v) {
    const q = S.retire, age = N(q.age), ret = N(q.retAge), end = N(q.endAge), out = $("#rt-out", v);
    if (!(age > 0 && ret >= age && end > ret)) { out.innerHTML = '<div class="note gold">Check the three ages: now, when you stop working, and how long to plan for.</div>'; return; }
    if (!(N(q.spend) > 0)) { out.innerHTML = '<div class="note gold">Enter your yearly spending in retirement to run the plan.</div>'; return; }
    const r = FE.retirementSim(q, 500, 11), p = r.success, wr = r.withdrawal, net = Math.max(0, N(q.spend) - N(q.pension));
    const tips = r.ages.map((a, i) => "Age " + a + ": typical " + sh(r.bands.p50[i]) + "; poor markets " + sh(r.bands.p10[i]) + "; good markets " + sh(r.bands.p90[i]));
    out.innerHTML = `<div class="tiles"><div class="tile ${p >= .9 ? "good" : p >= .75 ? "warn" : "bad"}"><div class="k">Money lasts to ${end}</div><div class="v">${Math.round(p * 100)}%</div><div class="s">of 500 futures</div></div><div class="tile"><div class="k">At ${ret}, typically</div><div class="v">${sh(r.medianAtRet)}</div><div class="s">today's rupees</div></div><div class="tile ${wr <= .035 ? "good" : wr <= .045 ? "warn" : "bad"}"><div class="k">First-year withdrawal</div><div class="v">${isFinite(wr) ? pct(wr) : "–"}</div><div class="s">of the corpus</div></div></div>
      <section class="card"><h3><span>Your investments by age</span><span>today's rupees</span></h3>${lineChart({ x: r.ages.map(String), y: r.bands.p50, lo: r.bands.p10, hi: r.bands.p90, tips, markX: ret - age, markLabel: "stop work", label: "Projected investments by age" })}<div class="legend"><span><i style="background:var(--accent)"></i>Typical outcome</span><span><i style="background:var(--accent);opacity:.25"></i>Middle 80% of outcomes</span></div></section>
      <div class="note ${p >= .9 ? "ok" : p >= .75 ? "gold" : "bad"}">${p >= .9 ? "<b>The plan holds in nine futures out of ten.</b>" : p >= .75 ? "<b>The plan holds in most futures, with little room.</b>" : "<b>The plan runs out in many futures.</b>"} Spending ${sh(net)} a year from investments needs about <b>${sh(net / .033)}</b> at a 3.3% starting withdrawal, the cautious Indian rule of thumb. ${r.medianAtRet >= net / .033 ? "You are projected to pass that." : "You are projected to reach " + sh(r.medianAtRet) + ". Saving more, working longer or spending less each help."}</div>
      <p class="small">A simple model: one person, steady spending in real terms, no tax on withdrawals, no large one-off costs. Health costs usually rise faster than prices. Treat a result under 85% as a plan to strengthen.</p>`;
  }
};

/* ---------- Loans ---------- */
VIEWS.loans = {
  render() {
    if (!S.liabs.length) return `<div class="ph"><div><h2>Loans</h2><p>See when each loan ends and what prepaying saves.</p></div></div><div class="card"><p class="empty">No loans recorded. Add one under Assets and loans.</p><button class="btn pri" type="button" data-go="wealth">Go to Assets and loans</button></div>`;

  swp: { n: "Monthly withdrawal", f: [["c", "Starting amount (₹)", 10000000], ["w", "Withdraw each month (₹)", 50000], ["r", "Return (% a year)", 8, "pct"], ["i", "Raise withdrawal by (% a year)", 6, "pct"]], calc: t => { let v = t.c, w = t.w, m = 0; const mr = Math.pow(1 + t.r / 100, 1 / 12) - 1; while (v > 0 && m < 720) { if (m && m % 12 === 0) w *= 1 + t.i / 100; v = (v - w) * (1 + mr); m++; } return [["Money lasts", m >= 720 ? "60 years or more" : ym(m), 1], ["First-year withdrawal rate", pct(t.c > 0 ? t.w * 12 / t.c : 0)], ["Withdrawal in year 20", inr(t.w * Math.pow(1 + t.i / 100, 19)) + " a month"]]; } },
  fd: { n: "Fixed deposit", f: [["a", "Deposit (₹)", 500000], ["r", "Rate (% a year)", 6.45, "pct"], ["y", "Years", 3, "num"], ["t", "Your tax on interest (%)", 31.2, "pct"]], calc: t => { const fv = t.a * Math.pow(1 + t.r / 400, 4 * t.y), eff = Math.pow(1 + t.r / 400, 4) - 1, at = t.a * Math.pow(1 + eff * (1 - t.t / 100), t.y); return [["Maturity value", inr(fv), 1], ["After tax paid each year", inr(at)], ["Return after tax", pct(FE.cagr(t.a, at, t.y), 2) + " a year"]]; } },

  hra: { n: "HRA exemption", f: [["b", "Basic pay plus DA, a year (₹)", 1000000], ["h", "HRA received, a year (₹)", 400000], ["rent", "Rent paid, a year (₹)", 360000], ["metro", "Live in a 50% city?", "1", "select", [["1", "Yes"], ["0", "No"]]]], calc: t => { const x = [t.h, Math.max(0, t.rent - .1 * t.b), (t.metro ? .5 : .4) * t.b], ex = Math.max(0, Math.min(...x)); return [["Exempt HRA, old regime", inr(ex), 1], ["Taxable HRA", inr(Math.max(0, t.h - ex))], ["Least of", "HRA " + sh(x[0]) + "; rent less 10% of basic " + sh(x[1]) + "; " + (t.metro ? "50" : "40") + "% of basic " + sh(x[2])]]; }, note: () => "50% cities for " + FE.YEARS[S.year].short + ": " + FE.YEARS[S.year].metros.replace(" or ", ", ") + ". The new regime gives no HRA exemption." },
  cagr: { n: "Growth rate", f: [["a", "Value at the start (₹)", 100000], ["b", "Value at the end (₹)", 250000], ["y", "Years between", 7, "num"]], calc: t => { const g = FE.cagr(t.a, t.b, t.y); return [["Growth a year (CAGR)", pct(g, 2), 1], ["Multiple", (t.a > 0 ? t.b / t.a : 0).toFixed(2) + "×"], ["Years to double at this rate", g > 0 ? (Math.log(2) / Math.log(1 + g)).toFixed(1) : "–"]]; } },

}

      <section class="card"><h3><span>A mix that fits</span><span>financial investments</span></h3>
        ${pl.cur ? `<div class="mixrow"><span>Now</span>${mixBar(pl.cur)}</div>` : ""}<div class="mixrow"><span>Suggested</span>${mixBar(pl.mix)}</div>
        <div class="legend"><span><i style="background:var(--c1)"></i>Equity<b>${pl.cur ? Math.round(pl.cur.equity) + "% → " : ""}${pl.mix.equity}%</b></span><span><i style="background:var(--c3)"></i>Debt and deposits<b>${pl.cur ? Math.round(pl.cur.debt) + "% → " : ""}${pl.mix.debt}%</b></span><span><i style="background:var(--c4)"></i>Gold<b>${pl.cur ? Math.round(pl.cur.gold) + "% → " : ""}${pl.mix.gold}%</b></span></div>
        <p class="small" style="margin-top:10px">A starting point from age ${pl.age} and a ${esc(pl.risk)} temperament${pl.retired ? ", capped in retirement" : ""}. Your home and business are left out. Money needed within three years stays out of equity whatever the mix.</p>
        ${N(S.settings.target.equity) !== pl.mix.equity ? `<div class="btns" style="margin-top:8px"><button class="btn sm" type="button" id="pl-target">Use ${pl.mix.equity}% as my equity target</button></div>` : ""}</section>
      <section class="card"><h3><span>Options that fit each purpose</span><span>after tax, a year</span></h3><div class="tw"><table>${pl.shortlist.map(p => `<tr><th colspan="2" style="text-align:left;padding-top:10px">${esc(p.n)}</th></tr>${p.items.map(i => `<tr><td>${esc(i.n)}${i.safe ? "" : " *"}${i.note ? `<div class="small">${esc(i.note)}</div>` : ""}</td><td>${pct(i.after)}</td></tr>`).join("")}`).join("")}</table></div>
        <p class="small" style="margin-top:8px">Yields use ${pl.lead ? esc(pl.lead.name) + "'s" : "your"} tax rates (interest ${pct(pl.rates.int)}). * Assumed long-run return; the value can fall sharply along the way. Categories, not specific funds: choose low-cost direct plans.</p></section>
      ${pl.band ? `<section class="card"><h3><span>At your income</span><span>${esc(pl.band.n)}</span></h3><p style="font-size:.95rem">${esc(pl.band.text)}</p></section>` : ""}
      <section class="card"><h3><span>Schemes to look at</span><span>${pl.schemes.length}</span></h3><div class="rows">${pl.schemes.map(x => `<div class="row"><span><span class="n">${esc(x.n)}</span><span class="m" style="display:block">${esc(x.what)}</span></span><span></span></div>`).join("")}</div></section>
    </div></div>
    <footer class="fine">This plan is built from rules of thumb that Indian planners commonly use, applied to the numbers you entered. It is not personal investment advice, and Rupee Desk is not a SEBI-registered investment adviser. It names categories, never specific securities. Confirm tax matters with a chartered accountant. Rules verified ${FE.RULES_VERIFIED}; rates as of ${FE.RATES_ASOF}.</footer>`;
  },
  mount(v) {
    $("#pl-copy", v).onclick = async () => { try { await navigator.clipboard.writeText(planText(FE.plan(S, S.year, TODAY))); toast("Plan copied"); } catch (e) { toast("Copy was blocked by the browser"); } };
    $("#pl-save", v).onclick = () => saveText("rupee-desk-plan-" + iso(TODAY) + ".md", planText(FE.plan(S, S.year, TODAY)));
    const tg = $("#pl-target", v); if (tg) tg.onclick = () => { S.settings.target.equity = FE.plan(S, S.year, TODAY).mix.equity; save(); render(); toast("Equity target updated"); };
    $("#pl-prof", v).onclick = () => {
      const inds = S.members.filter(m => m.kind !== "huf"), lead = FE.leadOf(S), item = { lead: lead ? lead.id : "", risk: S.settings.risk || "balanced", dependants: S.settings.dependants === "no" ? "no" : "yes", kids: S.settings.kids, daughter: S.settings.daughter === "yes" ? "yes" : "no" };
      const fields = [{ k: "lead", label: "Plan around", type: "select", opts: inds.map(m => [m.id, m.name]) }, { k: "risk", label: "If investments fell 30% in a year", type: "select", opts: RISK_OPTS }, { k: "dependants", label: "Does anyone depend on your income?", type: "select", opts: [["yes", "Yes"], ["no", "No"]] }, { k: "kids", label: "Children under 18", type: "num", max: 12 }, { k: "daughter", label: "A daughter under 10?", type: "select", opts: [["no", "No"], ["yes", "Yes"]] }];
      inds.forEach(m => { item["occ_" + m.id] = FE.occOf(m); item["age_" + m.id] = m.age; fields.push({ k: "age_" + m.id, label: m.name + ": age", type: "num", max: 120 }, { k: "occ_" + m.id, label: m.name + ": occupation", type: "select", opts: Object.entries(FE.OCC).map(([k, o]) => [k, o.n]) }); });
      editItem({ title: "Your profile", fields, item, onSave: d => { Object.assign(S.settings, { lead: d.lead, risk: d.risk, dependants: d.dependants, kids: N(d.kids), daughter: d.daughter }); inds.forEach(m => { m.occ = d["occ_" + m.id]; if (N(d["age_" + m.id]) > 0) m.age = N(d["age_" + m.id]); }); save(); render(); } });
    };
  }
};

/* ---------- Business and practice ---------- */
const BIZ_F = () => [{ k: "name", label: "Name", type: "text", req: 1, wide: 1 }, { k: "owner", label: "Owner", type: "select", opts: S.members.filter(m => m.kind !== "huf").map(m => [m.id, m.name]) }, { k: "type", label: "Kind", type: "select", opts: [["profession", "Profession: doctor, CA, lawyer, architect, consultant"], ["business", "Business: trading, manufacturing, services"]] },
  { k: "supply", label: "What it supplies", type: "select", opts: [["services", "Taxable services"], ["goods", "Goods only"], ["both", "Goods and services"], ["exempt", "Exempt services: healthcare, education"]] }, { k: "receipts", label: "Received by bank or digital, a year (₹)", req: 1 }, { k: "cash", label: "Received in cash, a year (₹)" }, { k: "expenses", label: "Business expenses, a year (₹)", hint: "Rent, salaries, materials, depreciation, loan interest" }, { k: "fixed", label: "Fixed costs a month (₹)", hint: "Costs that continue if income stops" }, { k: "reserve", label: "Cash kept for the business (₹)" }];
const BIZ_GUARD = { profession: ["Professional indemnity cover sized to the largest claim you could face", "Personal accident and disability cover for the person the income depends on", "Insurance for premises and equipment", "Records and logins that a trusted person can reach", "A written plan for patients or clients, staff and dues if you cannot work"], business: ["Insurance for stock, premises and fire", "Term cover at least equal to business loans, so they do not fall on the family", "Business and personal money in separate accounts", "A partnership deed or succession note that says who runs it and who owns what", "Supplier and customer dues written down, not held in memory"] };
VIEWS.business = {
  render() {
    const add = `<button class="btn pri" type="button" id="bz-add">Add a business or practice</button>`;
    if (!S.biz.length) return `<div class="ph"><div><h2>Business and practice</h2><p>For professionals, traders and business owners: presumptive scheme or books, the limits that matter, and the buffer the business needs.</p></div><div class="btns">${add}</div></div>
      <div class="card"><p class="empty">Nothing here yet. Add your practice or business with a year's receipts and expenses. Salaried and retired households can skip this page.</p></div>`;
    const b = S.biz.find(x => x.id === S.ui.biz) || S.biz[0]; S.ui.biz = b.id; const owner = member(b.owner) || S.members[0];
    return `<div class="ph"><div><h2>Business and practice</h2><p>Presumptive scheme or books, the limits that matter, and the buffer the business needs.</p></div><div class="btns">${add}</div></div>
    <div class="pills" style="margin-bottom:12px">${S.biz.map(x => `<button class="pill" type="button" data-biz="${x.id}" aria-pressed="${x.id === b.id}">${esc(x.name)}</button>`).join("")}</div>
    <div class="cols"><div class="stack"><section class="card"><h3><span>${esc(b.name)}</span><span>${esc(owner.name)}</span></h3><div class="rows">
        <div class="row"><span class="n">Receipts for the year</span><span class="a">${sh(N(b.receipts) + N(b.cash))}<small>${N(b.cash) > 0 ? sh(N(b.cash)) + " in cash" : "none in cash"}</small></span></div>
        <div class="row"><span class="n">Expenses</span><span class="a">${N(b.expenses) > 0 ? sh(N(b.expenses)) : "not entered"}</span></div>
        <div class="row"><span class="n">Fixed costs a month</span><span class="a">${N(b.fixed) > 0 ? sh(N(b.fixed)) : "not entered"}</span></div>
        <div class="row"><span class="n">Cash kept for the business</span><span class="a">${sh(N(b.reserve))}</span></div></div>
        <div class="btns" style="margin-top:12px"><button class="btn" type="button" id="bz-edit">Edit</button></div></section>
      <section class="card"><h3><span>Protect it</span></h3><ul class="tips">${BIZ_GUARD[b.type === "business" ? "business" : "profession"].map(x => `<li>${x}</li>`).join("")}</ul></section></div>
      <div class="stack sticky" id="bz-out"></div></div>
    <footer class="fine">The comparison taxes the owner's whole income under each choice, using the lower regime. It leaves out accountant and audit fees, depreciation choices, partner remuneration and GST itself. The five-year rule: leave 44AD and you cannot return to it for five years. Take these figures to your chartered accountant.</footer>`;
  },
  mount(v) {
    const edit = (it, isNew) => editItem({ title: isNew ? "Add a business or practice" : "Edit " + it.name, isNew, fields: BIZ_F(), item: it, onSave: d => { S.ui.biz = d.id; upsert(S.biz, d); }, onDelete: isNew ? null : () => removeItem(S.biz, it.id, it.name) });
    $("#bz-add", v).onclick = () => { const o = S.members.find(m => ["professional", "business", "freelance"].includes(FE.occOf(m))) || S.members[0]; edit({ id: uid(), owner: o.id, type: FE.occOf(o) === "business" ? "business" : "profession", supply: FE.occOf(o) === "business" ? "goods" : "services" }, 1); };
    if (!S.biz.length) return;
    $("#bz-edit", v).onclick = () => edit(S.biz.find(x => x.id === S.ui.biz));
    v.addEventListener("click", e => {
      const p = e.target.closest("[data-biz]"); if (p) { S.ui.biz = p.dataset.biz; save(); render(); return; }
      const a = e.target.closest("[data-apply]"); if (!a) return;
      const b = S.biz.find(x => x.id === S.ui.biz), o = member(b.owner); if (!o) return; const old = Object.assign({}, o.t), c = FE.bizCompare(o, b, S.year);
      Object.assign(o.t, { receipts: "", profitPct: "", turnDigital: "", turnCash: "", profit: "" });
      if (a.dataset.apply === "pres") Object.assign(o.t, c.prof ? { bizMode: "44ada", receipts: c.total } : { bizMode: "44ad", turnDigital: N(b.receipts), turnCash: N(b.cash) }); else Object.assign(o.t, { bizMode: "actual", profit: Math.round(c.booksProfit) });
      save(); render(); toast(o.name + "'s Tax page updated", () => { o.t = old; save(); render(); });
    });
    this.refresh(v);
  },
  refresh(v) {
    const b = S.biz.find(x => x.id === S.ui.biz), out = $("#bz-out", v); if (!b || !out) return; const o = member(b.owner) || S.members[0], c = FE.bizCompare(o, b, S.year), hasExp = N(b.expenses) > 0;
    if (!(c.total > 0)) { out.innerHTML = '<div class="note gold">Enter the year\'s receipts to compare.</div>'; return; }
    const sch = c.prof ? "44ADA" : "44AD", line = (lvl, t, d) => `<div class="check ${lvl}"><span class="ic" aria-hidden="true">${lvl === "ok" ? "✓" : lvl === "info" ? "i" : "!"}</span><span><span class="t">${t}</span><span class="d" style="display:block">${d}</span></span><span></span></div>`;
    const cur = o.t.bizMode || "none", using = cur === "44ada" || cur === "44ad" ? "pres" : cur === "actual" ? "books" : "";
    out.innerHTML = `<div class="tiles"><div class="tile"><div class="k">Receipts</div><div class="v">${sh(c.total)}</div><div class="s">${Math.round(c.cashShare * 100)}% in cash</div></div><div class="tile"><div class="k">Real margin</div><div class="v">${hasExp ? pct(c.margin, 0) : "–"}</div><div class="s">${hasExp ? sh(c.booksProfit) + " profit" : "add expenses"}</div></div><div class="tile"><div class="k">${sch} assumes</div><div class="v">${pct(c.total > 0 ? c.presProfit / c.total : 0, 0)}</div><div class="s">${sh(c.presProfit)} profit</div></div></div>
      <section class="card"><h3><span>Presumptive scheme or books</span><span>${esc(o.name)}'s whole tax</span></h3><div class="tw"><table><tr><th></th><th>${sch}</th><th>Books</th></tr>
        <tr><td>Profit taxed</td><td>${c.eligible ? inr(c.presProfit) : "–"}</td><td>${hasExp ? inr(c.booksProfit) : "–"}</td></tr>
        <tr class="tot"><td>Tax for the year</td><td>${c.eligible ? inr(c.presTax) : "not open"}</td><td>${hasExp ? inr(c.booksTax) : "–"}</td></tr>
        <tr class="sub"><td>Books of account</td><td>not needed</td><td>needed</td></tr><tr class="sub"><td>Tax audit</td><td>no</td><td>${c.audit ? "yes" : "no"}</td></tr><tr class="sub"><td>Advance tax</td><td>one instalment, 15 March</td><td>four instalments</td></tr></table></div>
        <div class="note ${c.better === "presumptive" ? "ok" : "gold"}" style="margin-top:10px">${!c.eligible ? `<b>${sch} is not open:</b> receipts are above the ${sh(c.limit)} limit${c.cashShare > .05 ? " that applies when more than 5% is cash" : ""}. Books and, at this size, ${c.audit ? "a tax audit are" : "regular accounts are"} required.` : !hasExp ? `<b>${sch} is open to you.</b> Add your real expenses to see whether books would be cheaper.` : c.better === "presumptive" ? `<b>${sch} costs ${inr(c.saving)} less</b> and needs no books. Your real margin of ${pct(c.margin, 0)} is above the ${pct(c.presProfit / c.total, 0)} the scheme assumes.` : `<b>Books cost ${inr(c.saving)} less in tax,</b> because your real margin of ${pct(c.margin, 0)} is below the ${pct(c.presProfit / c.total, 0)} the scheme assumes. ${c.audit ? "That route needs books and a tax audit: " + c.auditWhy.toLowerCase() + ". Set the fees against the saving." : "It needs proper books."}`}</div>
        <div class="btns" style="margin-top:10px">${c.eligible ? `<button class="btn ${using === "pres" ? "pri" : ""}" type="button" data-apply="pres">${using === "pres" ? "Using" : "Use"} ${sch} on the Tax page</button>` : ""}${hasExp ? `<button class="btn ${using === "books" ? "pri" : ""}" type="button" data-apply="books">${using === "books" ? "Using" : "Use"} books profit on the Tax page</button>` : ""}</div></section>
      <section class="card"><h3><span>Limits that matter</span></h3><div class="checks">
        ${line(c.eligible ? "ok" : "warn", c.eligible ? "Within the " + sch + " limit of " + sh(c.limit) : "Above the " + sch + " limit of " + sh(c.limit), c.prof ? "₹75 lakh if cash is 5% or less of receipts, otherwise ₹50 lakh." : "₹3 crore if cash is 5% or less of receipts, otherwise ₹2 crore.")}
        ${line(c.audit ? "warn" : "ok", c.audit ? "Tax audit applies if you keep books" : "No tax audit at this size", c.audit ? c.auditWhy + "." : c.prof ? "For professions an audit starts above ₹50 lakh of receipts when books are kept." : "For business an audit starts above ₹1 crore of turnover, or ₹10 crore when cash is 5% or less.")}
        ${line(c.gst.exempt ? "ok" : c.gst.over ? "warn" : "ok", c.gst.exempt ? "GST: exempt services need no registration" : c.gst.over ? "GST registration is required" : "Below the GST registration limit", c.gst.exempt ? "Healthcare and education services are exempt. Taxable side income, such as rent from commercial property, still counts towards the ₹20 lakh limit." : "The limit is " + sh(c.gst.limit) + " a year in most states (lower in some north-eastern and hill states). Selling to other states or through online marketplaces can require it earlier.")}
        ${isFinite(c.bufferMonths) ? line(c.bufferMonths >= 6 ? "ok" : c.bufferMonths >= 3 ? "warn" : "bad", "Business buffer covers " + c.bufferMonths.toFixed(1) + " months of fixed costs", c.bufferMonths >= 6 ? "Six months or more lets the business ride out a slow spell without touching family savings." : "Aim for six months (" + sh(c.fixed * 6) + "), kept apart from the family emergency fund. You hold " + sh(c.reserve) + ".") : line("info", "Add fixed monthly costs to size a buffer", "Rent, salaries and loan EMIs that continue when income stops.")}
      </div></section>`;
  }
};

/* ---------- boot ---------- */
(function boot() { shell(); const h = location.hash.slice(1); route = VIEWS[h] ? h : "home"; render(); cloudInit(); })();

</script>
</body>
</html>
